<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Controlled ChatGPT Fixture</title></head>
<body>
  <main id="conversation" aria-live="polite">
    <article data-message-author-role="assistant" data-turn="1"><p>历史回复</p><img src="/image.png?id=old" data-result-id="old" width="1" height="1" alt="历史图片"></article>
  </main>
  <form id="composer-form">
    <textarea aria-label="Message ChatGPT" hidden></textarea>
    <div id="prompt-textarea" role="textbox" aria-label="Message ChatGPT" contenteditable="true"></div>
    <input type="file" aria-label="Upload files" multiple>
    <button type="submit" aria-label="Send prompt">发送</button>
  </form>
  <script>
    const params = new URLSearchParams(location.search);
    const scenario = params.get('scenario') || 'success';
    const count = Number(params.get('count') || '2');
    const readyDelay = Number(params.get('readyDelay') || '0');
    const loginFlash = Number(params.get('loginFlash') || '0');
    const modernDom = params.get('dom') === 'modern';
    const form = document.querySelector('#composer-form');
    let input = form.querySelector('#prompt-textarea');
    const conversation = document.querySelector('#conversation');
    if (modernDom) {
      conversation.innerHTML = '<section data-turn="assistant"><div data-message-author-role="assistant"><p>历史回复</p></div></section>';
    }
    if (readyDelay > 0) {
      form.hidden = true;
      setTimeout(() => { form.hidden = false; }, readyDelay);
    }
    if (loginFlash > 0) {
      form.hidden = true;
      const login = document.createElement('button');
      login.textContent = 'Log in';
      document.body.appendChild(login);
      setTimeout(() => { login.remove(); form.hidden = false; }, loginFlash);
    }
    if (params.get('composerSwap') === '1') {
      input.addEventListener('focus', () => {
        const previous = input;
        const replacement = previous.cloneNode(true);
        previous.hidden = true;
        setTimeout(() => {
          previous.replaceWith(replacement);
          input = replacement;
        }, 100);
      }, { once: true });
    }
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const prompt = input.textContent;
      input.textContent = '';
      const safePrompt = prompt.replace(/[<>&]/g, '');
      conversation.insertAdjacentHTML('beforeend', modernDom
        ? `<section data-turn="user"><div data-message-author-role="user"><p>${safePrompt}</p></div><button>编辑消息</button></section>`
        : `<article data-message-author-role="user"><p>${safePrompt}</p></article>`);
      const assistant = document.createElement(modernDom ? 'section' : 'article');
      if (modernDom) assistant.dataset.turn = 'assistant';
      else assistant.dataset.messageAuthorRole = 'assistant';
      assistant.dataset.state = 'queued';
      assistant.innerHTML = modernDom
        ? '<div data-message-author-role="assistant"><p data-status>排队中</p></div>'
        : '<p data-status>排队中</p>';
      conversation.appendChild(assistant);
      if (modernDom) setTimeout(() => assistant.querySelector('[data-message-author-role="assistant"]')?.removeAttribute('data-message-author-role'), 10);
      if (scenario === 'timeout') return;
      if (scenario === 'failure') {
        setTimeout(() => { assistant.dataset.state = 'failed'; assistant.innerHTML = '<p role="alert">429 rate limited</p>'; }, 50);
        return;
      }
      setTimeout(() => { assistant.dataset.state = 'generating'; assistant.querySelector('[data-status]').textContent = '生成中'; }, 30);
      for (let i = 1; i <= count; i += 1) {
        setTimeout(() => {
          const figure = document.createElement('figure');
          figure.innerHTML = modernDom
            ? `<img src="/image.png?id=${i}" width="1" height="1" alt="结果 ${i}"><img src="/image.png?id=${i}" width="1" height="1" alt="" aria-hidden="true"><img src="/image.png?id=${i}" width="1" height="1" alt="" aria-hidden="true">`
            : `<img src="/image.png?id=${i}" data-result-id="result-${i}" width="1" height="1" alt="结果 ${i}"><a role="button" data-result-id="result-${i}" aria-label="Download image ${i}" download="result-${i}.png" href="/image.png?id=${i}">下载</a>`;
          assistant.appendChild(figure);
          assistant.dataset.state = i === count ? 'complete' : 'generating';
        }, 80 * i);
      }
    });
  </script>
</body>
</html>
